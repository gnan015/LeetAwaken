<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leet Awaken — Never Break Your Streak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --lc-amber: #ffa116;
      --lc-amber-glow: rgba(255, 161, 22, 0.25);
      --discord: #5865f2;
      --discord-hover: #4752c4;
      --telegram: #229ed9;
      --telegram-hover: #1c88bd;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 161, 22, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(88, 101, 242, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      text-align: center;
      z-index: 1;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .flame-icon {
      width: 28px;
      height: 28px;
      fill: var(--lc-amber);
      filter: drop-shadow(0 0 12px var(--lc-amber-glow));
    }

    .title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .input-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.45rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"], select {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(10, 16, 29, 0.85);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"] {
      font-family: 'JetBrains Mono', monospace;
    }

    select {
      cursor: pointer;
    }

    input:focus, select:focus {
      border-color: var(--lc-amber);
      box-shadow: 0 0 0 3px var(--lc-amber-glow);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.82rem;
      margin-top: 0.4rem;
      display: none;
    }

    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      color: #ffffff;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-discord {
      background-color: var(--discord);
    }

    .btn-telegram {
      background-color: var(--telegram);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-header">
      <svg class="flame-icon" viewBox="0 0 24 24">
        <path d="M12 23c-4.97 0-9-4.03-9-9 0-3.8 2.37-7.05 5.73-8.35.5-.19.98.24.91.77-.38 2.87.89 4.58 2.36 4.58 1.47 0 2.5-1.5 2-4.5-.11-.66.62-1.15 1.17-.79C18.23 8.75 21 12.06 21 16c0 3.87-4.03 7-9 7z"/>
      </svg>
      <h1 class="title">Leet Awaken</h1>
    </div>

    <p class="subtitle">
      Automated streak alerts. Choose your time and platform to get pinged if no solved problem is logged for the day.
    </p>

    <div class="input-group">
      <label for="leetcodeUsername">LeetCode Handle</label>
      <input type="text" id="leetcodeUsername" placeholder="e.g. tour_de_force" autocomplete="off" />
      <div id="errorText" class="error-msg">Please enter your LeetCode username.</div>
    </div>

    <div class="input-group">
      <label for="reminderTime">Reminder Time (IST)</label>
      <select id="reminderTime">
        <option value="18_12">06:00 PM IST</option>
        <option value="19_13">07:00 PM IST</option>
        <option value="20_14">08:00 PM IST</option>
        <option value="21_15" selected>09:00 PM IST (Recommended)</option>
        <option value="22_16">10:00 PM IST</option>
        <option value="23_17">11:00 PM IST</option>
      </select>
    </div>

    <div class="btn-stack">
      <button id="discordBtn" class="btn btn-discord">
        <svg viewBox="0 0 127.14 96.36">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
        Alert me on Discord
      </button>

      <button id="telegramBtn" class="btn btn-telegram">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
        </svg>
        Alert me on Telegram
      </button>
    </div>
  </div>

  <script>
    const DISCORD_CLIENT_ID = "1567762977849876490";
    const DISCORD_REDIRECT = encodeURIComponent("https://my-n8n-app-jwks.onrender.com/webhook/discord-callback");
    const TELEGRAM_BOT_USERNAME = "LeetAwakenBot";

    const input = document.getElementById("leetcodeUsername");
    const timeSelect = document.getElementById("reminderTime");
    const errorText = document.getElementById("errorText");

    function validate() {
      const username = input.value.trim();
      if (!username) {
        errorText.style.display = "block";
        input.focus();
        return null;
      }
      errorText.style.display = "none";
      return username;
    }

    // 1. Discord Trigger
    document.getElementById("discordBtn").addEventListener("click", () => {
      const username = validate();
      if (!username) return;
      const [istHour, utcHour] = timeSelect.value.split('_');
      const statePayload = `${username}_${istHour}_${utcHour}`;
      const authUrl = `https://discord.com/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&response_type=code&redirect_uri=${DISCORD_REDIRECT}&integration_type=0&scope=webhook.incoming+identify&state=${encodeURIComponent(statePayload)}`;
      window.location.href = authUrl;
    });

    // 2. Telegram Trigger
    document.getElementById("telegramBtn").addEventListener("click", () => {
      const username = validate();
      if (!username) return;
      const [istHour, utcHour] = timeSelect.value.split('_');
      const tgUrl = `https://t.me/${TELEGRAM_BOT_USERNAME}?start=${encodeURIComponent(username + '_' + istHour + '_' + utcHour)}`;
      window.location.href = tgUrl;
    });
  </script>
</body>
</html>
