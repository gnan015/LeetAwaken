<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCode Streak Reminder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background-color: #3b82f620;
      color: #60a5fa;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .input-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: #5865f2;
      box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.25);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 0.4rem;
      display: none;
    }

    .btn-discord {
      width: 100%;
      background-color: #5865f2;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-discord:hover {
      background-color: #4752c4;
    }

    .btn-discord:active {
      transform: scale(0.98);
    }

    .btn-discord svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .footer-note {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Automated Sentinel</span>
    <h1>LeetCode Daily Reminder</h1>
    <p class="subtitle">Get notified in your Discord channel every day at 9:00 PM IST if you haven't logged an accepted submission.</p>

    <div class="input-group">
      <label for="leetcodeUsername">LeetCode Username</label>
      <input type="text" id="leetcodeUsername" placeholder="e.g. tour_de_force" autocomplete="off" />
      <div id="errorText" class="error-msg">Please enter a valid LeetCode username.</div>
    </div>

    <button id="discordBtn" class="btn-discord">
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
      Continue with Discord
    </button>

    <p class="footer-note">Discord will ask you to pick the server and channel where alerts should arrive.</p>
  </div>

  <script>
    const CLIENT_ID = "1567762977849876490";
    const REDIRECT_URI = encodeURIComponent("https://my-n8n-app-jwks.onrender.com/webhook/discord-callback");

    const input = document.getElementById("leetcodeUsername");
    const errorText = document.getElementById("errorText");
    const btn = document.getElementById("discordBtn");

    function proceedToDiscord() {
      const username = input.value.trim();

      if (!username) {
        errorText.style.display = "block";
        input.focus();
        return;
      }

      errorText.style.display = "none";
      btn.innerText = "Redirecting...";
      btn.style.pointerEvents = "none";

      const authUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${REDIRECT_URI}&integration_type=0&scope=webhook.incoming+identify&state=${encodeURIComponent(username)}`;

      window.location.href = authUrl;
    }

    btn.addEventListener("click", proceedToDiscord);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        proceedToDiscord();
      }
    });
  </script>
</body>
</html>
